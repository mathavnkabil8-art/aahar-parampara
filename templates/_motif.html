{# Signature mandala motif — glowing dark mode heritage design #}
{% macro mandala(size='140', color='#FFD700', klass='') %}
<svg class="{{ klass }}" width="{{ size }}" height="{{ size }}" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg" style="filter: drop-shadow(0 0 15px {{ color }});">
  <!-- Outer glowing rings -->
  <circle cx="100" cy="100" r="96" stroke="{{ color }}" stroke-width="1.5" opacity="0.6" stroke-dasharray="4 4" />
  <circle cx="100" cy="100" r="88" stroke="{{ color }}" stroke-width="0.5" opacity="0.8"/>
  <circle cx="100" cy="100" r="76" stroke="{{ color }}" stroke-width="2" opacity="1"/>
  
  <!-- Central bindu (dot) -->
  <circle cx="100" cy="100" r="6" fill="{{ color }}"/>
  
  <!-- Lotus petals outer -->
  {% for i in range(12) %}
  <g transform="rotate({{ i * 30 }} 100 100)">
    <path d="M100 24 C 112 36, 112 56, 100 68 C 88 56, 88 36, 100 24 Z" fill="{{ color }}" opacity="0.7"/>
    <circle cx="100" cy="14" r="3" fill="{{ color }}" opacity="0.9"/>
  </g>
  {% endfor %}
  
  <!-- Lotus petals inner -->
  {% for i in range(8) %}
  <g transform="rotate({{ i * 45 + 22.5 }} 100 100)">
    <path d="M100 40 C 108 52, 108 62, 100 70 C 92 62, 92 52, 100 40 Z" fill="{{ color }}" opacity="0.8"/>
  </g>
  {% endfor %}
  
  <!-- Intricate accents -->
  {% for i in range(24) %}
  <g transform="rotate({{ i * 15 }} 100 100)">
    <line x1="100" y1="76" x2="100" y2="82" stroke="{{ color }}" stroke-width="1.5" opacity="0.8"/>
  </g>
  {% endfor %}
</svg>
{% endmacro %}
