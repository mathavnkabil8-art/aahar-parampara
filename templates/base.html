<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Lost Rasoi{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}bg-monuments{% endblock %}">
<div class="page">
  {% block content %}{% endblock %}
</div>
<script src="{{ url_for('static', filename='js/wheel.js') }}" defer></script>
<script src="{{ url_for('static', filename='js/reveal.js') }}" defer></script>
<script src="{{ url_for('static', filename='js/widget.js') }}"></script>
</body>
</html>
